<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Sid's Loft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap">

<style>
:root{
  --paper:#EFE4D2; --paper-2:#E1D2BA; --paper-edge:#C7B295;
  --ink:#2B2028; --muted:#6B5F63;
  --amber:#C07A24; --foil:#C9A24A;
  --hud-bg:rgba(22,16,20,.80); --hud-ink:#EDE1D0; --hud-line:rgba(237,225,208,.18);
  --warn:#C07A24;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#06060A; overflow:hidden;
  font-family:Karla,"Segoe UI",system-ui,sans-serif; color:var(--hud-ink);
  -webkit-font-smoothing:antialiased;
}
#gl{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}

/* ── loading ─────────────────────────────── */
#load{
  position:fixed; inset:0; z-index:40; display:grid; place-items:center;
  background:radial-gradient(80% 60% at 50% 45%,#1D1520,#0A0810);
  transition:opacity .8s ease, visibility .8s;
}
#load.gone{opacity:0; visibility:hidden; pointer-events:none}
.loadinner{text-align:center; padding:28px; max-width:440px}
.loadinner h1{font:600 30px/1.15 Fraunces,Georgia,serif; margin:0 0 12px; color:#F0E3D0}
.loadinner p{font-size:14px; line-height:1.6; color:#B3A395; margin:0}
.emberdot{width:9px; height:9px; border-radius:50%; background:var(--amber);
  margin:22px auto 0; box-shadow:0 0 22px 7px rgba(192,122,36,.5);
  animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35; transform:scale(.85)}50%{opacity:1; transform:scale(1.15)}}

/* ── HUD ─────────────────────────────────── */
.hud{position:fixed; inset:0; pointer-events:none; padding:18px; z-index:10;
  display:flex; flex-direction:column; justify-content:space-between}
.plaque{
  align-self:flex-start; display:flex; align-items:baseline; gap:12px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:3px;
  padding:9px 16px; backdrop-filter:blur(8px);
}
.plaque h1{font:600 19px/1 Fraunces,Georgia,serif; margin:0; color:var(--hud-ink)}
.plaque span{font:500 11px/1 Karla,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--foil)}
.hudrow{display:flex; flex-direction:column; align-items:center; gap:12px}
.hint{
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:999px;
  padding:8px 20px; font-size:13px; backdrop-filter:blur(8px);
  min-height:35px; display:flex; align-items:center; text-align:center;
}
.hint b{color:var(--foil); font-weight:700}

/* ── mood switch ─────────────────────────── */
.moodbar{
  pointer-events:auto; display:flex; align-items:center; gap:12px;
  background:var(--hud-bg); border:1px solid var(--hud-line); border-radius:999px;
  padding:8px 16px 8px 18px; backdrop-filter:blur(8px);
}
.moodbar .lab{font:500 10px/1 Karla,sans-serif; letter-spacing:.16em;
  text-transform:uppercase; color:var(--foil); white-space:nowrap}
#moodname{font-size:12px; color:var(--hud-ink); min-width:82px}
#moods{display:flex; gap:7px}
#moods button{
  width:20px; height:20px; padding:0; border-radius:50%; cursor:pointer;
  background:var(--sw); border:2px solid rgba(255,255,255,.22);
  font-size:10px; line-height:1; color:rgba(255,255,255,.75);
  display:grid; place-items:center;
  transition:transform .15s ease, border-color .15s ease;
}
#moods button.off{background:#20222A; border-color:rgba(255,255,255,.34)}
#moods button:hover{transform:scale(1.18)}
#moods button[aria-pressed="true"]{border-color:#fff; transform:scale(1.22)}
#moods button:focus-visible{outline:2px solid #fff; outline-offset:2px}

/* ── stargazing ──────────────────────────── */
#skyexit{
  position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
  z-index:20; pointer-events:auto; cursor:pointer;
  background:rgba(12,16,30,.82); color:#E8EFFA;
  border:1px solid rgba(200,220,255,.34); border-radius:999px;
  padding:12px 26px; font:500 14px/1 Karla,sans-serif; letter-spacing:.02em;
  backdrop-filter:blur(8px);
}
#skyexit:hover{background:rgba(20,28,50,.92)}
body.skymode .plaque,body.skymode .moodbar,body.skymode .hint{opacity:0; pointer-events:none}
body.lights-out .hint{background:rgba(10,8,12,.9)}

/* ── panels ──────────────────────────────── */
.scrim{
  position:fixed; inset:0; background:rgba(8,5,10,.66); backdrop-filter:blur(4px);
  display:none; place-items:center; padding:24px; z-index:30; overflow:auto;
}
.scrim.on{display:grid}
.sheet{
  width:min(940px,100%); background:var(--paper); color:var(--ink);
  border-radius:4px; box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:rise .3s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.985)}}
.sheet header{display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:20px 26px 14px; border-bottom:1px solid var(--paper-edge)}
.sheet h2{margin:0; font:600 25px/1.15 Fraunces,Georgia,serif; text-wrap:balance}
.sheet .sub{font-size:12.5px; color:var(--muted); margin-top:5px}
.x{width:34px; height:34px; flex:none; border-radius:50%; border:1px solid var(--paper-edge);
  background:transparent; color:var(--ink); font-size:17px; cursor:pointer}
.x:hover{background:var(--paper-2)}
.body{padding:22px 26px 26px}
.spread{display:grid; grid-template-columns:minmax(0,4fr) minmax(0,5fr); gap:26px; align-items:start}
.cover{aspect-ratio:2/3; max-height:430px; border-radius:3px; padding:22px 18px;
  display:flex; flex-direction:column; justify-content:space-between; text-align:center;
  position:relative; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.32)}
.cover::after{content:""; position:absolute; inset:9px; border:1.5px solid rgba(201,162,74,.55); border-radius:2px}
.cover .kicker{font:500 10px/1 Karla,sans-serif; letter-spacing:.24em; text-transform:uppercase; color:rgba(201,162,74,.9)}
.cover .t{font:700 clamp(19px,2.4vw,27px)/1.15 Fraunces,Georgia,serif; color:#F6EEDC; text-wrap:balance}
.cover .jp{font:400 12px/1.4 Karla,sans-serif; color:rgba(246,238,220,.6); margin-top:8px}
.cover .st{font:500 11px/1.3 Karla,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:rgba(201,162,74,.85)}
.facts{list-style:none; margin:0; padding:0}
.facts li{display:flex; justify-content:space-between; gap:14px; padding:9px 0;
  border-bottom:1px dotted var(--paper-edge); font-size:14px}
.facts b{font-weight:500; color:var(--muted); font-size:12px; letter-spacing:.1em; text-transform:uppercase}
.facts span{font-variant-numeric:tabular-nums; text-align:right}
.stamp{display:inline-block; transform:rotate(-6deg); border:2.5px solid currentColor; border-radius:3px;
  padding:5px 12px; font:700 12px/1 Karla,sans-serif; letter-spacing:.18em; opacity:.85; margin-bottom:14px}
.rate{display:flex; align-items:baseline; gap:9px; margin:6px 0 16px}
.rate strong{font:700 40px/1 Fraunces,Georgia,serif; font-variant-numeric:tabular-nums}
.rate small{color:var(--muted); font-size:13px}
.bar{height:7px; border-radius:99px; background:var(--paper-2); overflow:hidden; margin:9px 0 5px}
.bar i{display:block; height:100%; background:var(--warn)}
.note{font:400 21px/1.5 Caveat,cursive; color:#3A2F3E; margin-top:18px;
  padding-top:16px; border-top:1px solid var(--paper-edge)}
.note b{display:block; font:500 10px/1 Karla,sans-serif; letter-spacing:.2em;
  text-transform:uppercase; color:var(--muted); margin-bottom:9px}
.pager{display:flex; align-items:center; justify-content:space-between; gap:14px;
  margin-top:22px; padding-top:16px; border-top:1px solid var(--paper-edge)}
.pager button{border:1px solid var(--paper-edge); background:transparent; color:var(--ink);
  font:500 13px/1 Karla,sans-serif; padding:10px 16px; border-radius:2px; cursor:pointer}
.pager button:hover{background:var(--paper-2)}
.pager span{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.entry{display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--paper-edge)}
.entry:last-child{border-bottom:none}
.entry .sw{width:5px; flex:none; border-radius:99px}
.entry h4{margin:0 0 3px; font:600 17px/1.2 Fraunces,Georgia,serif}
.entry p{margin:0 0 4px; font-size:13px; color:var(--muted)}
.shelfnote{font-size:13px; color:var(--muted); margin:0 0 16px; line-height:1.55}
.map{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}
.house{border:1.5px dashed var(--paper-edge); border-radius:4px; padding:18px 14px; text-align:center}
.house.me{border-style:solid; border-color:var(--ink); background:var(--paper-2)}
.house h4{margin:8px 0 3px; font:600 15px/1 Fraunces,Georgia,serif}
.house p{margin:0; font-size:11.5px; color:var(--muted); letter-spacing:.05em}
.photoactions{display:flex; gap:12px; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  font:600 13px/1 Karla,sans-serif; padding:12px 20px; border-radius:2px}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--paper-edge)}
.btn:hover{opacity:.88}
.err{color:#8E4034; font-size:13px; margin-top:12px}

@media (max-width:720px){
  .spread{grid-template-columns:1fr; gap:18px}
  .cover{aspect-ratio:3/2; max-height:190px}
  .sheet h2{font-size:21px} .body{padding:18px}
  .plaque h1{font-size:16px} .hint{font-size:11.5px; padding:7px 14px}
  .moodbar{padding:7px 12px; gap:8px} #moodname,.moodbar .lab{display:none}
  #moods button{width:24px; height:24px}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important} }
</style>

<canvas id="gl"></canvas>

<div class="hud">
  <div class="plaque"><h1 id="owner">Sid's Loft</h1><span id="count">10 volumes</span></div>
  <div class="hudrow">
    <div class="moodbar">
      <span class="lab">Lights</span>
      <div id="moods"></div>
      <span id="moodname">Warm yellow</span>
    </div>
    <div class="hint" id="hint">Click the floor to walk · drag to look · scroll to zoom</div>
  </div>
</div>

<button id="skyexit" hidden>← Back to the room</button>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div id="load">
  <div class="loadinner">
    <h1>Sid's Loft</h1>
    <p>Raising the roof and waking the wombats…</p>
    <div class="emberdot"></div>
  </div>
</div>
